name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Check frontend types
        run: npx tsc -p tsconfig.app.json --noEmit || true
      - name: Check server types
        run: cd server && npm install --legacy-peer-deps && npx tsc --noEmit || true

  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm install --legacy-peer-deps && cd server && npm install --legacy-peer-deps
      - name: Run API tests
        run: npx vitest run tests/api/ --passWithNoTests
